name: Collect Reddit data

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Collection time budget in minutes (lower it for a quick test run)"
        type: number
        default: 300

# Never run two collections at once: both would read and advance the same checkpoint.
concurrency:
  group: reddit-collector
  cancel-in-progress: false

# Collection runs here because this repository is public (free Actions minutes). The data's
# source of truth is DATA_REPO's data branch; after every run the same branch is copied to
# this repository and to the other team repository, so all three stay in sync.
# Reading DATA_REPO and pushing to adele-kha needs the TEAM_REPO_TOKEN secret: a classic
# personal access token (ghp_..., repo scope) from an account with write access to both. A
# fine-grained token (github_pat_...) cannot reach repositories owned by another account.
# If it expires, runs fail at "Check out data branch" until it is replaced; nothing is lost.
permissions:
  contents: write   # push the data copy to this repository's data branch

env:
  DATA_REPO: UitbreidenAI/drug-exp-api
  DATA_BRANCH: data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub maximum; leaves room for export and commit after Collect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Data and the checkpoint live on DATA_REPO's data branch, cloned to ./data. The token
      # goes in an auth header stored in that clone's own config (stray whitespace from pasting
      # is stripped), so the later push authenticates too.
      - name: Check out data branch
        env:
          TEAM_REPO_TOKEN: ${{ secrets.TEAM_REPO_TOKEN }}
        run: |
          token=$(printf %s "$TEAM_REPO_TOKEN" | tr -d '[:space:]')
          if [ -z "$token" ]; then
            echo "::error::TEAM_REPO_TOKEN secret is missing; it is needed to read and save data in $DATA_REPO"
            exit 1
          fi
          case "$token" in
            ghp_*) ;;
            github_pat_*) echo "::warning::TEAM_REPO_TOKEN is a fine-grained token; it cannot reach repositories owned by another account. Use a classic token (ghp_...) with repo scope." ;;
            *) echo "::warning::TEAM_REPO_TOKEN does not start with ghp_ (${#token} chars); the secret may hold extra text." ;;
          esac
          auth=$(printf 'x-access-token:%s' "$token" | base64 -w0)
          echo "::add-mask::$auth"
          header="AUTHORIZATION: basic $auth"
          git -c http.https://github.com/.extraheader="$header" clone --quiet --depth=1 \
            --branch "$DATA_BRANCH" "https://github.com/${DATA_REPO}.git" data
          git -C data config http.https://github.com/.extraheader "$header"

      # The collector stops on its own after 5h (between days) so the run ends
      # green; the step timeout is only a backstop for a day stuck in rate-limit waits
      # (one request can retry for up to 20 minutes past the budget). If the API stays
      # blocked or down, the collector pauses and retries instead of failing the run.
      - name: Collect
        timeout-minutes: 345
        run: >-
          python -m collector.collect --config config/subreddits.yaml --dest data
          --max-minutes ${{ inputs.max_minutes || 300 }}

      - name: Export latest Ozempic comments
        if: always()
        run: >-
          python scripts/extract_ozempic_comments.py
          --input data/curated/comments
          --output data/exports/ozempic_100k_comments.csv

      - name: Write data README
        if: always()
        run: python scripts/write_data_readme.py --data data

      - name: Commit data
        if: always()
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          # Report the stream furthest behind, so the message doesn't overstate progress.
          through=$(jq -r '[.[]] | min' state/checkpoint.json 2>/dev/null || echo "partial day")
          git -c user.name="github-actions[bot]" \
              -c user.email="41898237+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Collect data (oldest next day: $through)"
          git push origin "HEAD:$DATA_BRANCH"

      # Copy DATA_REPO's data branch to the other two repositories, every run, even when
      # nothing new was collected, so a copy that missed a run catches up. Pushes are
      # fast-forward only (no --force): a copy that has diverged is reported, not overwritten.
      # This repository uses the workflow's own GITHUB_TOKEN; adele-kha uses TEAM_REPO_TOKEN.
      # The empty extraheader first drops the DATA_REPO auth stored in the clone's config.
      # Every copy is attempted; the step fails afterwards if any push failed.
      - name: Sync data to the other repositories
        if: always()
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM_REPO_TOKEN: ${{ secrets.TEAM_REPO_TOKEN }}
        run: |
          if [ ! -d .git ]; then
            echo "::error::No data checkout; nothing to sync"
            exit 1
          fi
          # Collected days were committed onto a shallow clone; without history git can't
          # tell a push to a copy that is behind is a fast-forward, and rejects it.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --quiet --unshallow origin "$DATA_BRANCH"
          fi
          failed=0
          sync() {  # sync <owner/repo> <token>
            local auth
            auth=$(printf 'x-access-token:%s' "$(printf %s "$2" | tr -d '[:space:]')" | base64 -w0)
            echo "::add-mask::$auth"
            echo "Syncing $DATA_BRANCH to $1"
            git -c http.https://github.com/.extraheader= \
                -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
                push "https://github.com/$1.git" "HEAD:refs/heads/$DATA_BRANCH" \
              || { echo "::error::sync to $1 failed"; failed=1; }
          }
          sync "$GITHUB_REPOSITORY" "$GH_TOKEN"
          sync adele-kha/uitbreiden_drug_experience "$TEAM_REPO_TOKEN"
          exit $failed
