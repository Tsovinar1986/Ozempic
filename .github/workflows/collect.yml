name: Collect Reddit data

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}

# Never run two collections at once: both would read and advance the same checkpoint.
concurrency:
  group: reddit-collector
  cancel-in-progress: false

permissions:
  contents: write   # push collected data to the `data` branch

env:
  DATA_BRANCH: data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # room for export + commit after the 30-min Collect step
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Data and the checkpoint live on a separate branch, checked out at ./data.
      # The first run creates it as an empty orphan branch.
      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "+refs/heads/${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}"
            git worktree add -B "$DATA_BRANCH" data "origin/$DATA_BRANCH"
          else
            git worktree add --detach data
            git -C data checkout --orphan "$DATA_BRANCH"
            git -C data rm -rf --quiet .
          fi

      # The collector stops on its own after 24 minutes (between days) so the run ends
      # green; the step timeout is only a backstop for a day stuck in rate-limit waits.
      - name: Collect
        timeout-minutes: 30
        run: python -m collector.collect --config config/subreddits.yaml --dest data --max-minutes 24

      - name: Export latest Ozempic comments
        if: always()
        run: >-
          python scripts/extract_ozempic_comments.py
          --input data/curated/comments
          --output data/exports/ozempic_100k_comments.csv

      - name: Commit data
        if: always()
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          # Report the stream furthest behind, so the message doesn't overstate progress.
          through=$(jq -r '[.[]] | min' state/checkpoint.json 2>/dev/null || echo "partial day")
          git -c user.name="github-actions[bot]" \
              -c user.email="41898237+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Collect data (oldest next day: $through)"
          git push origin "HEAD:$DATA_BRANCH"

      # Mirror the data branch to the team repo. Needs a TEAM_REPO_TOKEN secret: a classic
      # personal access token (repo scope) from an account with write access there.
      # The empty extraheader drops the GITHUB_TOKEN auth that actions/checkout configured.
      - name: Mirror data to team repo
        if: always()
        working-directory: data
        env:
          TEAM_REPO_TOKEN: ${{ secrets.TEAM_REPO_TOKEN }}
        run: |
          if [ -z "$TEAM_REPO_TOKEN" ]; then
            echo "TEAM_REPO_TOKEN not set, skipping mirror"
            exit 0
          fi
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${TEAM_REPO_TOKEN}@github.com/adele-kha/uitbreiden_drug_experience.git" \
            "HEAD:data"
