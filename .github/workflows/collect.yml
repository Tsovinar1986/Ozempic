name: Collect Reddit data

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}

# Never run two collections at once: both would read and advance the same checkpoint.
concurrency:
  group: reddit-collector
  cancel-in-progress: false

permissions:
  contents: write   # push collected data to the `data` branch

env:
  DATA_BRANCH: data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Data and the checkpoint live on a separate branch, checked out at ./data.
      # The first run creates it as an empty orphan branch.
      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "+refs/heads/${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}"
            git worktree add -B "$DATA_BRANCH" data "origin/$DATA_BRANCH"
          else
            git worktree add --detach data
            git -C data checkout --orphan "$DATA_BRANCH"
            git -C data rm -rf --quiet .
          fi

      - name: Collect
        timeout-minutes: 30
        run: python -m collector.collect --config config/subreddits.yaml --dest data

      - name: Export latest Ozempic comments
        if: always()
        run: >-
          python scripts/extract_ozempic_comments.py
          --input data/curated/comments
          --output data/exports/ozempic_100k_comments.csv

      - name: Commit data
        if: always()
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          # Report the stream furthest behind, so the message doesn't overstate progress.
          through=$(jq -r '[.[]] | min' state/checkpoint.json 2>/dev/null || echo "partial day")
          git -c user.name="github-actions[bot]" \
              -c user.email="41898237+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Collect data (oldest next day: $through)"
          git push origin "HEAD:$DATA_BRANCH"
