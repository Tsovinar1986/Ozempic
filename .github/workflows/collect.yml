name: Collect Reddit data

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      mirror_only:
        description: "Skip collection; only push the current data branch to the team repos"
        type: boolean
        default: false

# Never run two collections at once: both would read and advance the same checkpoint.
concurrency:
  group: reddit-collector
  cancel-in-progress: false

permissions:
  contents: write   # push collected data to the `data` branch

env:
  DATA_BRANCH: data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub maximum; leaves room for export, commit and mirror after Collect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Data and the checkpoint live on a separate branch, checked out at ./data.
      # The first run creates it as an empty orphan branch.
      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "+refs/heads/${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}"
            git worktree add -B "$DATA_BRANCH" data "origin/$DATA_BRANCH"
          else
            git worktree add --detach data
            git -C data checkout --orphan "$DATA_BRANCH"
            git -C data rm -rf --quiet .
          fi

      # The collector stops on its own after 5h20m (between days) so the run ends
      # green; the step timeout is only a backstop for a day stuck in rate-limit waits.
      - name: Collect
        if: ${{ !inputs.mirror_only }}
        timeout-minutes: 345
        run: python -m collector.collect --config config/subreddits.yaml --dest data --max-minutes 320

      - name: Export latest Ozempic comments
        if: ${{ always() && !inputs.mirror_only }}
        run: >-
          python scripts/extract_ozempic_comments.py
          --input data/curated/comments
          --output data/exports/ozempic_100k_comments.csv

      - name: Commit data
        if: always()
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          # Report the stream furthest behind, so the message doesn't overstate progress.
          through=$(jq -r '[.[]] | min' state/checkpoint.json 2>/dev/null || echo "partial day")
          git -c user.name="github-actions[bot]" \
              -c user.email="41898237+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Collect data (oldest next day: $through)"
          git push origin "HEAD:$DATA_BRANCH"

      # Mirror the data branch to the team repos. Needs a TEAM_REPO_TOKEN secret: a classic
      # personal access token (repo scope) from an account with write access to each repo.
      # The token goes in an auth header rather than the URL (no URL-escaping issues, stray
      # whitespace from pasting is stripped); the empty extraheader first drops the
      # GITHUB_TOKEN auth that actions/checkout configured.
      # Every repo is attempted; the step fails afterwards if any push failed.
      - name: Mirror data to team repos
        if: always()
        working-directory: data
        env:
          TEAM_REPO_TOKEN: ${{ secrets.TEAM_REPO_TOKEN }}
          MIRROR_REPOS: >-
            adele-kha/uitbreiden_drug_experience
            UitbreidenAI/drug-exp-api
        run: |
          if [ -z "$TEAM_REPO_TOKEN" ]; then
            echo "TEAM_REPO_TOKEN not set, skipping mirror"
            exit 0
          fi
          token=$(printf %s "$TEAM_REPO_TOKEN" | tr -d '[:space:]')
          case "$token" in
            ghp_*) echo "Token: classic (${#token} chars)" ;;
            github_pat_*) echo "::warning::Token is fine-grained; it cannot reach repos owned by another user. Use a classic token with repo scope." ;;
            *) echo "::warning::Token does not start with ghp_ (${#token} chars); the secret may hold extra text." ;;
          esac
          # The data branch was fetched shallow; without its history git can't tell a push
          # to a repo that is behind is a fast-forward, and rejects it.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --quiet --unshallow origin "$DATA_BRANCH"
          fi
          auth=$(printf 'x-access-token:%s' "$token" | base64 -w0)
          echo "::add-mask::$auth"
          failed=0
          for repo in $MIRROR_REPOS; do
            echo "Pushing data to $repo"
            git -c http.https://github.com/.extraheader= \
                -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
                push "https://github.com/${repo}.git" "HEAD:data" \
              || { echo "::error::push to $repo failed"; failed=1; }
          done
          exit $failed
