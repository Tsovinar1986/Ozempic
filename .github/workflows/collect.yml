name: Collect Reddit data

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Collection time budget in minutes (lower it for a quick test run)"
        type: number
        default: 300

# Never run two collections at once: both would read and advance the same checkpoint.
concurrency:
  group: reddit-collector
  cancel-in-progress: false

# Collection runs here because this repository is public (free Actions minutes), but the
# data lives only in the private team repository below. Reading and pushing it needs the
# TEAM_REPO_TOKEN secret: a classic personal access token (repo scope) from an account with
# write access to DATA_REPO. If it expires, runs fail at "Check out data branch" until it
# is replaced; nothing is collected or lost meanwhile.
permissions:
  contents: read

env:
  DATA_REPO: UitbreidenAI/drug-exp-api
  DATA_BRANCH: data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub maximum; leaves room for export and commit after Collect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Data and the checkpoint live on DATA_REPO's data branch, cloned to ./data. The token
      # goes in an auth header stored in that clone's own config (stray whitespace from pasting
      # is stripped), so the later push authenticates too.
      - name: Check out data branch
        env:
          TEAM_REPO_TOKEN: ${{ secrets.TEAM_REPO_TOKEN }}
        run: |
          token=$(printf %s "$TEAM_REPO_TOKEN" | tr -d '[:space:]')
          if [ -z "$token" ]; then
            echo "::error::TEAM_REPO_TOKEN secret is missing; it is needed to read and save data in $DATA_REPO"
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$token" | base64 -w0)
          echo "::add-mask::$auth"
          header="AUTHORIZATION: basic $auth"
          git -c http.https://github.com/.extraheader="$header" clone --quiet --depth=1 \
            --branch "$DATA_BRANCH" "https://github.com/${DATA_REPO}.git" data
          git -C data config http.https://github.com/.extraheader "$header"

      # The collector stops on its own after 5h (between days) so the run ends
      # green; the step timeout is only a backstop for a day stuck in rate-limit waits
      # (one request can retry for up to 20 minutes past the budget). If the API stays
      # blocked or down, the collector pauses and retries instead of failing the run.
      - name: Collect
        timeout-minutes: 345
        run: >-
          python -m collector.collect --config config/subreddits.yaml --dest data
          --max-minutes ${{ inputs.max_minutes || 300 }}

      - name: Export latest Ozempic comments
        if: always()
        run: >-
          python scripts/extract_ozempic_comments.py
          --input data/curated/comments
          --output data/exports/ozempic_100k_comments.csv

      - name: Write data README
        if: always()
        run: python scripts/write_data_readme.py --data data

      - name: Commit data
        if: always()
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          # Report the stream furthest behind, so the message doesn't overstate progress.
          through=$(jq -r '[.[]] | min' state/checkpoint.json 2>/dev/null || echo "partial day")
          git -c user.name="github-actions[bot]" \
              -c user.email="41898237+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Collect data (oldest next day: $through)"
          git push origin "HEAD:$DATA_BRANCH"
